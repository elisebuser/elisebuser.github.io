<!DOCTYPE html>
<html lang="en">

<head>
    <title>My First Blog Post | Elise Buser Photography</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" type="image/png" href="../data/favicon.png">

    <link rel="stylesheet" href="../collections.css">

    <style>
        #blogPost {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        #blogPostContent {
            max-width: 900px;
            margin: 0 auto;
        }

        #blogPostContent > img {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 0 auto 30px auto;
        }

        #postText {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <a
        id="topLeftLogo"
        href="../index.html"
        aria-label="Elise Buser Photography home"
    >
        <img
            src="../data/logo.png"
            alt="Elise Buser Photography"
        >
    </a>

    <div id="version">v1.1.9</div>

    <nav aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="../collections.html">Collections</a>
        <a href="../about.html">About</a>
        <a href="../blog.html">Blog</a>
    </nav>

    <main id="page">

        <article id="blogPost">

            <header id="pageHeader">
                <h1>My First Blog Post</h1>
                <p>September 7, 2026</p>
            </header>

            <div id="blogPostContent">

                <img
                    src="https://pub-81f0405a7471418c8f41a932f79f6163.r2.dev/EB_Website_Folder/Blog/test-post/cover.jpg"
                    alt="My First Blog Post"
                >

                <div id="postText"></div>

            </div>

        </article>

    </main>

    <script>
        fetch("../data/test-post.txt")
            .then(response => response.text())
            .then(text => {
                document.getElementById("postText").innerText = text;
            })
            .catch(error => {
                console.error("Error loading blog post:", error);
            });
    </script>

</body>
</html>
